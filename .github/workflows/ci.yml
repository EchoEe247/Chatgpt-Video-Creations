name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Require workflow version bump for canonical contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate-workflow-version-bump.py "$BASE_SHA" HEAD
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Render current 2D geometry smoke candidate
        run: python scripts/render-2d-geometry-candidate-002.py /tmp/geometry-candidate.mp4
      - name: QA rendered smoke candidate
        run: python scripts/videoctl.py qa /tmp/geometry-candidate.mp4 --width 1280 --height 720 --fps 24 --duration 8 --video-codec h264 --pixel-format yuv420p --no-require-audio
      - name: Preserve failed render evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geometry-candidate-failure
          path: /tmp/geometry-candidate.mp4
          if-no-files-found: ignore
          retention-days: 7

  canvas-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/renderers/canvas_handdrawn/package-lock.json
      - name: Install locked Canvas renderer dependencies
        working-directory: src/renderers/canvas_handdrawn
        run: npm ci --ignore-scripts
      - name: Audit Canvas renderer dependencies
        working-directory: src/renderers/canvas_handdrawn
        run: npm audit --audit-level=high --omit=dev
      - name: Parse Canvas renderer JavaScript
        run: |
          node --check src/renderers/canvas_handdrawn/render.mjs
          node --check src/renderers/canvas_handdrawn/request-render.mjs
          node --check src/renderers/canvas_handdrawn/runtime/core.js
          node --check src/renderers/canvas_handdrawn/runtime/studio.js
          node --check src/renderers/canvas_handdrawn/runtime/cels.js
          node --check src/renderers/canvas_handdrawn/runtime/materials.js
