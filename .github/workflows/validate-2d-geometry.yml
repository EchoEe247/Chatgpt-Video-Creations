name: Validate 2D geometry

on:
  push:
    paths:
      - 'src/core/geometry.py'
      - 'src/animation_2d/**'
      - 'tests/test_geometry.py'
      - 'templates/set-anchors.json'
      - 'scripts/validate-scene-alignment.py'
      - 'docs/SCENE_GEOMETRY.md'
      - '.github/workflows/validate-2d-geometry.yml'
  pull_request:
    paths:
      - 'src/core/geometry.py'
      - 'src/animation_2d/**'
      - 'tests/test_geometry.py'
      - 'templates/set-anchors.json'
      - 'scripts/validate-scene-alignment.py'
      - 'docs/SCENE_GEOMETRY.md'
      - '.github/workflows/validate-2d-geometry.yml'

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run geometry regression tests
        run: python -m unittest tests.test_geometry -v
      - name: Validate structural example geometry
        run: python scripts/validate-scene-alignment.py templates/set-anchors.json
