name: Validate 2D geometry

on:
  push:
    paths:
      - 'src/core/**'
      - 'src/animation_2d/**'
      - 'tests/**'
      - '.github/workflows/validate-2d-geometry.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/animation_2d/**'
      - 'tests/**'
      - '.github/workflows/validate-2d-geometry.yml'

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run geometry regression tests
        run: python -m unittest discover -s tests -v
