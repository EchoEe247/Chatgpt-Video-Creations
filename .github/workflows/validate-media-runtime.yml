name: Validate media runtime

on:
  push:
    paths:
      - 'src/core/media.py'
      - 'src/core/fonts.py'
      - 'src/core/production_manifest.py'
      - 'src/core/production_runtime.py'
      - 'src/core/review_pack.py'
      - 'src/core/scene_plan.py'
      - 'scripts/videoctl.py'
      - 'scripts/productionctl.py'
      - 'scripts/validate-scene-plan.py'
      - 'scripts/assemble-scenes.py'
      - 'scripts/render-2d-geometry-candidate*.py'
      - 'scripts/validate-production-v2.py'
      - 'tests/test_media.py'
      - 'tests/test_assembly.py'
      - 'tests/test_production_controller.py'
      - 'tests/test_production_manifest.py'
      - 'tests/test_production_runtime.py'
      - 'tests/test_scene_plan.py'
      - 'templates/production-v2.json'
      - 'templates/scene-assembly.json'
      - 'shows/wrong-shift/season-01/episode-01/production-v2.json'
      - 'shows/wrong-shift/season-01/episode-01/scene-plan.json'
      - 'templates/new-episode/scene-plan.json'
      - 'docs/LOCAL_WORKSPACE_VIDEO_WORKFLOW.md'
      - '.github/workflows/validate-media-runtime.yml'
  pull_request:
    paths:
      - 'src/core/media.py'
      - 'src/core/fonts.py'
      - 'src/core/production_manifest.py'
      - 'src/core/production_runtime.py'
      - 'src/core/review_pack.py'
      - 'src/core/scene_plan.py'
      - 'scripts/videoctl.py'
      - 'scripts/productionctl.py'
      - 'scripts/validate-scene-plan.py'
      - 'scripts/assemble-scenes.py'
      - 'scripts/render-2d-geometry-candidate*.py'
      - 'scripts/validate-production-v2.py'
      - 'tests/test_media.py'
      - 'tests/test_assembly.py'
      - 'tests/test_production_controller.py'
      - 'tests/test_production_manifest.py'
      - 'tests/test_production_runtime.py'
      - 'tests/test_scene_plan.py'
      - 'templates/production-v2.json'
      - 'templates/scene-assembly.json'
      - 'shows/wrong-shift/season-01/episode-01/production-v2.json'
      - 'shows/wrong-shift/season-01/episode-01/scene-plan.json'
      - 'templates/new-episode/scene-plan.json'
      - 'docs/LOCAL_WORKSPACE_VIDEO_WORKFLOW.md'
      - '.github/workflows/validate-media-runtime.yml'

jobs:
  media-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pillow
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate production v2 template
        run: python scripts/validate-production-v2.py templates/production-v2.json
      - name: Validate episode scene-plan template
        run: python scripts/validate-scene-plan.py templates/new-episode/scene-plan.json
      - name: Check production controller state
        run: python scripts/productionctl.py status templates/production-v2.json
      - name: Validate Wrong Shift legacy migration record
        run: python scripts/validate-production-v2.py shows/wrong-shift/season-01/episode-01/production-v2.json
      - name: Validate Wrong Shift scene plan
        run: python scripts/validate-scene-plan.py shows/wrong-shift/season-01/episode-01/scene-plan.json
      - name: Render current 2D geometry baseline candidate
        run: python scripts/render-2d-geometry-candidate-002.py /tmp/geometry-candidate.mp4
      - name: QA rendered candidate
        run: python scripts/videoctl.py qa /tmp/geometry-candidate.mp4 --width 1280 --height 720 --fps 24 --duration 8 --video-codec h264 --pixel-format yuv420p --no-require-audio